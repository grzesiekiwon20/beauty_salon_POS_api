services:
  database:
    image: postgres:latest
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: database_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - network_sso
    volumes:
      - database_data:/var/lib/postgresql/database
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
volumes:
  database_data:

networks:
  network_sso:
    driver: bridge