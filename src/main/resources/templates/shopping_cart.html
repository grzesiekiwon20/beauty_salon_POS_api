<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout>" layout:decorate="~{main.html}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Cart - Beauty Salon</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5p5pWj9qG4m9T0s5e8L1rV8U8w==" crossorigin="anonymous">
    <!-- Optional: Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- Include your navbar here if it's a fragment -->
<!-- Example: th:replace="~{fragments/navbar :: navbar}" -->

<div class="container my-5" layout:fragment="cart">
    <h2 class="mb-4">Shopping Cart</h2>

    <div class="row">
        <!-- Cart Items -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-0">
                    <div th:if="${#sets.isEmpty(cartItems)}" class="p-5 text-center">
                        <p class="text-muted">Your cart is empty.</p>
                        <a th:href="@{/products/all}" class="btn btn-primary">Continue Shopping</a>
                    </div>

                    <table class="table table-hover align-middle mb-0" th:unless="${#sets.isEmpty(cartItems)}">
                        <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td class="text-center" style="width: 120px;">
                                <img th:if="${item.getProduct().getImage() != null and item.getProduct().getImage().length > 0}"
                                        th:src="@{'data:image/jpeg;base64,' + ${item.getProduct().imageBase64()}}"
                                     class="img-fluid rounded" alt="Product image" style="max-height: 100px;">
                            </td>
                            <td>
                                <h6 class="mb-1" th:text="${item.product.getName()}">Product Name</h6>
                                <small class="text-muted" th:text="${item.product.category.name}">Category</small>
                            </td>
                            <td class="text-center">
                                <span th:text="${#numbers.formatCurrency(item.product.price)}">$29.99</span>
                            </td>
                            <td class="text-center" style="width: 150px;">
                                <form th:action="@{/cart/update}" method="post" class="d-inline">
                                    <input type="hidden" name="cartItemId" th:value="${item.getId()}"/>
                                    <div class="input-group input-group-sm">
                                        <input type="hidden" id="down">
                                        <button class="btn btn-outline-secondary" type="submit" name="down" value="decrease">-</button>
                                        <input type="text" class="form-control text-center" th:value="${item.quantity}" readonly/>
                                        <input type="hidden" id="up">
                                        <button class="btn btn-outline-secondary" type="submit" name="up" value="increase">+</button>
                                    </div>
                                </form>
                            </td>
                            <td class="text-center">
                                <span th:text="'€' + ${item.getSubTotal()}"></span>
                            </td>
                            <td class="text-center">
                                <form th:action="@{/cart/remove}" method="post" class="d-inline">
                                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/products/all}" class="btn btn-outline-secondary">Continue Shopping</a>
                <a th:href="@{/cart/clear}" class="btn btn-outline-danger" th:unless="${#sets.isEmpty(cartItems)}">Clear Cart</a>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Order Summary</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span th:text="'€' +${cart.getTotal()}"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
<!--                        <span th:text="${cart.shipping > 0} ? ${#numbers.formatCurrency(cart.shipping)} : 'Free'">Free</span>-->
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Tax</span>
<!--                        <span th:text="${#numbers.formatCurrency(cart.tax)}">$12.00</span>-->
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <strong>Total</strong>
<!--                        <strong th:text="${#numbers.formatCurrency(cart.total)}">$131.96</strong>-->
                    </div>

                    <!-- Promo Code (Optional) -->
                    <form class="mb-3">
                        <div class="input-group">
<!--                            <input type="text" class="form-control" placeholder="Promo code">-->
                            <button class="btn btn-outline-secondary" type="button">Apply</button>
                        </div>
                    </form>

                    <a th:href="@{/checkout}" class="btn btn-primary w-100" th:unless="${#sets.isEmpty(cartItems)}">
                        Proceed to Checkout
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (for any interactive components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9gKZ24uBDMIDd8A4P0s7"
        crossorigin="anonymous"></script>
</body>
</html>
