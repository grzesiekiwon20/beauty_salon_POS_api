<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{main}"
>
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

<section layout:fragment="account_content">
    <div class="container mt-5">
        <div class="row">
            <nav class="col-12 navbar navbar-expand-lg shadow-sm">
                <div class="container-fluid">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#accountNavbarCollapse" aria-controls="accountNavbarCollapse"
                            aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="accountNavbarCollapse">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" th:href="@{/users/user}">Profile Information</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/address/}">Address Book</a>
                            </li>
                            <li class="nav-item dropdown" role="presentation">
                                <div class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                                     aria-expanded="false">
                                    <a class="link-underline link-underline-opacity-0"
                                       th:href="@{/users/user}">Admin</a>
                                </div>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Action</a></li>
                                    <li><a class="dropdown-item" th:href="@{/products/addNew}">Products Management</a>
                                    </li>
                                    <li><a class="dropdown-item" th:href="@{/services/manageServices}">Services Management</a>
                                    </li>
                                    <li>
                                        <hr class="dropdown-divider">
                                    </li>
                                    <li><a class="dropdown-item" href="#">Roles</a></li>
                                </ul>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                   href="#">Employees</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                   aria-current="page">Contact</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <div class="col-12  d-flex justify-content-center bg-light">
                <section class="account_content" layout:fragment="user_details"></section>
                <section class="employee_list" layout:fragment="employee_list"></section>
                <section class="productmng" layout:fragment="product_management_layout"></section>
                <section layout:fragment="service_entity_management_layout"></section>
                <section layout:fragment="address_book"></section>
                <section layout:fragment="services_list_admin_layout"></section>
            </div>
        </div>
    </div>
</section>

</body>
</html>
