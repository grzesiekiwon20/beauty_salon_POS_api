<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <form th:action="@{/address/save}"
              th:object="${address}"
              th:method="POST">
            <div class="d-flex flex-column">
                <div class="">
                    <label for="street">Street: </label>
                    <input id="street" type="text" th:field="*{street}">
                </div>
                <div class="">
                    <label for="city">City: </label>
                    <input id="city" type="text" th:field="*{city}">
                </div>
                <div class="">
                    <label for="post-code">Post code: </label>
                    <input id="post-code" type="text" th:field="*{postCode}">
                </div>
                <div>
                    <label for="address-type"></label>
                    <select id="address-type" th:field="*{addressType}">
                        <option th:value="${'HOME'}">Home</option>
                        <option th:value="${'DELIVERY'}">Delivery</option>
                        <option th:value="${'BILLING'}">Billing</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
