<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{/account/account.html}">
<head>
    <meta charset="UTF-8">
    <title>Address book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<section layout:fragment="address_book">
    <body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center" th:unless="${#lists.isEmpty(addressList)}">
            <div class="col" th:each="address: ${addressList}">
                <div class="card shadow-sm border-0" style="width: 20rem">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h5 class="mb-0"><i class="bi bi-geo-alt-fill me-2" th:text="${#strings.toLowerCase()}"></i></h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text text-center mb-4">
                            <strong>Company Name</strong><br>
                            123 Main Street<br>
                            Suite 456<br>
                            New York, NY 10001<br>
                            United States
                        </p>
                        <ul class="list-unstyled text-center">
                            <li class="mb-2"><i class="bi bi-telephone-fill text-primary me-2"></i>+1 (555) 123-4567</li>
                            <li class="mb-2"><i class="bi bi-envelope-fill text-primary me-2"></i>info@company.com</li>
                            <li><i class="bi bi-globe text-primary me-2"></i>www.company.com</li>
                        </ul>
                    </div>
                    <div class="card-footer text-center bg-light">
                        <small class="text-muted">Open Mon–Fri: 9AM–6PM</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS (optional, for any interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</section>
</body>
</html>
