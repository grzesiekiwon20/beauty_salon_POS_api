<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{main.html}">
<head>
    <meta charset="UTF-8">
    <title>Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<section layout:fragment="allServices">
    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-start pt-5">
            <div class="col-12">
                <div class="d-flex flex-wrap justify-content-center gap-4 p-5" th:unless="${#lists.isEmpty(allServices)}" >
                    <div th:each="service : ${allServices}" class="card shadow-sm border-0" style="width: 18rem; background-color: rgba(251, 251, 251, 0.15);">
                        <img th:if="${service.image() != null and service.image().length > 0}"
                             th:src="@{'data:image/jpeg;base64,' + ${service.imageBase64()}}"
                             class="card-img-top"
                             style="height: 200px; object-fit: cover;"
                             th:alt="${service.name()}" />
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-black text-opacity-50" th:text="${service.name()}"></h5>
                            <h6 class="fw-bold text-black text-opacity-50" th:text="'$' + ${service.price()}"></h6>
                            <a th:href="@{/activities/addNew(serviceId=${service.id})}" class="btn w-100 opacity-75" style="background-color: #FFD700">Book Now</a>
                            <a th:href="@{/services/byId/{id}(id=${service.id()})}" class="btn btn-primary w-100 opacity-75">View Details</a>
                        </div>
                    </div>
                </div>
                <div layout:fragment="service_detail" th:if="${serviceDetails != null}">
                    <div class="container" th:object="${serviceDetails}">
                        <div class="row d-flex bg-gray vh-100 align-items-center justify-content-center border-5 border-black">
                            <div class="col-xl-10 col-lg-12 col-md-8 col-sm-6  bg-black">
                                <div class="col-lg-2 col-md-4 col-sm-1">
                                    <div>
                                        <h6 th:text="${serviceDetails.name()}"></h6>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div th:if="${#lists.isEmpty(allServices) && #lists.isEmpty(allServicesCategory) && serviceDetails == null}" class="text-center py-5">
                    <p class="text-muted">No products found in this subcategory.</p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
