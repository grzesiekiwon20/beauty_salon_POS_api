<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{/account/account.html}">
<head>
    <meta charset="UTF-8">
    <title>Services_list_admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .button-hover {
            opacity: 0;
            transition: 0.15s;
        }

        /*.item-hover {*/
        /*    background-color: white;*/
        /*    transition: 0.15s;*/
        /*}*/

        /*.item-hover:hover {*/
        /*    .button-hover {*/
        /*        opacity: 1;*/
        /*    }*/

        /*    background-color: #cfe2ff;*/
        /*}*/

        .header-item {
            border: #0d6efd solid 1px;
        }

        .burger-button:hover {
            background-color: #0d6efd;
        }
    </style>

</head>
<body>

<section layout:fragment="services_list_admin_layout">
    <div class="container card border-0 shadow-sm">
        <div class="card-body p-0 row mt-4">
            <div class="col-12">
                <div class="row">
                    <div class="col-4">
                        <h3>Booking Services</h3>
                        <p>Create and edit courses, classes or appointments</p>
                    </div>
                    <div class="col me-auto">
                        <div class="d-flex justify-content-end">
                            <button class="btn rounded-2">
                                ...
                            </button>
                            <a class="btn add-service" th:href="@{/services/addNew}">
                                + Add a New Service
                            </a>
                        </div>

                    </div>
                </div>
            </div>
            <div class="" th:unless="${#lists.isEmpty(servicesList)}">
                <table class="table table-hover align-middle">
                    <tbody>
                    <tr class="border-2 border-primary">
                        <td><div class="form-check">
                            <input id="check" class="form-check-input" type="checkbox">
                            <label class="form-check-label" for="check"></label>
                        </div></td>
                        <td><div>Services</div></td>
                        <td><div>Price</div></td>
                        <td class=""><div>Schedule</div></td>
                    </tr>
                    <tr th:each="service: ${servicesList}" class="">
                        <td><div class="form-check">
                            <input id="checkDefault" type="checkbox" class="form-check-input">
                            <label class="form-check-label" for="checkDefault"></label>
                        </div></td>
                        <td class="">
                            <img class="rounded-2 mt-3 mb-3"
                                 th:src="@{'data:image/jpeg;base64,' + ${service.imageBase64()}}"
                                 alt="" style="width: 45px; height: 45px">
                        </td>
                        <td class="text-start">
                            <div th:text="${service.name()}" class=""></div>
                        </td>
                        <td>
                            <div class="text-start" th:text="'€' + ${service.price()}"></div>
                        </td>
                        <td>
                            <a href="#" class="">Show Availability</a>
                        </td>
                        <td>
                            <button class="btn btn-primary rounded">Edit</button>
                        </td>
                        <td>
                            <button class="">
                                <span class="fw-bolder">...</span>
                            </button>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</section>

</body>

</html>
