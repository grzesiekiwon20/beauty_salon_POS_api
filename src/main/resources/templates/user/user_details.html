<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{account/account.html}">
<head>
    <meta charset="UTF-8">
    <title>User details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<section  layout:fragment="user_details" th:object="${userDetails}">
    <section class="">
        <div class="container py-5">
            <div class="row d-flex justify-content-center">
                <div class="col-12 mb-4 mb-lg-0">
                    <div class="card mb-3" style="border-radius: .5rem;">
                        <div class="row g-0">
                            <div class="col-md-2 gradient-custom text-center text-white">
                            </div>
                            <div class="col-md-8 mt-1">
                                <div class="card-body p-4">
                                    <h6>Information</h6>
                                    <hr class="mt-1 mb-4">
                                    <h5 th:text="${userDetails.fullName()}"></h5>
                                    <div class="row pt-1">
                                        <div class="col-8 me-auto">
                                            <h6>Email</h6>
                                            <p th:text="${userDetails.email()}" class="text-muted"></p>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <h6>Phone</h6>
                                            <p th:text="${userDetails.phone()}" class="text-muted"></p>
                                        </div>
                                    </div>
                                    <h6>Address</h6>
                                    <hr class="mt-0 mb-4">
                                    <div class="row pt-1" th:object="${addressDetails}">
                                        <div class="col-6 mb-3">
                                            <h6>Street</h6>
                                            <p th:text="${addressDetails.street()}" class="text-muted"></p>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <h6>City</h6>
                                            <p th:text="${addressDetails.city()}" class="text-muted"></p>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <h6>Post code</h6>
                                            <p th:text="${addressDetails.postCode()}" class="text-muted"></p>
                                        </div>
                                        <div class="col-6 mb-3">
                                            <h6>Most Viewed</h6>
                                            <p class="text-muted">Dolor sit amet</p>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-start">
                                        <a href="#!"><i class="fab fa-facebook-f fa-lg me-3"></i></a>
                                        <a href="#!"><i class="fab fa-twitter fa-lg me-3"></i></a>
                                        <a href="#!"><i class="fab fa-instagram fa-lg"></i></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</section>
</body>
</html>
