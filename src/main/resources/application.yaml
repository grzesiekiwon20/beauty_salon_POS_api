spring:
  redis:
    port: 6379
  devtools:
    livereload:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    name: database
    url: jdbc:postgresql://localhost:5432/database
    username: database_user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 3MB
server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: 30m

application:
  file:
    uploads:
      photos-output-path: ./uploads
logging:
  level:
    web: debug
    org:
      springframework:
        security: debug